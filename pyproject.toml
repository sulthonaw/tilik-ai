[project]
name = "tilik-ai"
version = "0.1.0"
description = "Tilik AI - Multi-agent Financial & Market Intelligence System"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "EXE002", # executable file without shebang (Windows FS quirk)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
