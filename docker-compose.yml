version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: tilik_ai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tilik-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tilik_ai_backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379/0

volumes:
  redis_data:
